[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["build.py"]

[project]
# CONFIGURE: rename when reusing this template for a different report
name = "cadt-internship-report-template"
version = "0.1.0"
